[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "capability-registry-testbed"
version = "0.1.0"
description = "Evidence-driven shared capability contract and adapter experiments"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "azure-identity==1.25.3",
]

[project.optional-dependencies]
copilot = ["github-copilot-sdk==1.0.31", "aiohttp==3.13.4"]
maf = [
  "agent-framework-core==1.25.0",
  "agent-framework-foundry==1.16.1",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "mcp==2.3.0",
  "a2a-sdk[http-server]==1.3.0",
  "python-dotenv==1.2.4",
  "PyJWT[crypto]==2.15.1",
  "nanoarrow==0.8.0",
]
governance = [
  "rfc8785==0.1.4", "PyJWT[crypto]==2.15.1",
  "opentelemetry-sdk==1.45.2",
  "tenacity==9.2.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[tool.hatch.build.targets.wheel]
packages = ["adapters", "selection", "tools", "mocks", "governance", "gateway", "consumer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires explicit live credentials and opt-in"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["baselines", ".venv*", ".artifacts", "capture-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
